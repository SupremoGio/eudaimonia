# Nixpacks config. El Root Directory del servicio en Railway está fijado a
# "gio_v3" — el contexto de build YA ES el contenido de gio_v3/, así que
# ninguna ruta aquí debe llevar el prefijo "gio_v3/" ni hacer "cd gio_v3".
#
# El CSS de Tailwind se compila localmente (`npm run build:css`) y se
# commitea ya construido en gio_v3/static/css/tailwind-built.css — no se
# recompila en el build de Railway.
#
# Node sigue detectándose solo (hay un package.json, para ese build local
# de Tailwind), pero al haber también un requirements.txt, nixpacks elegía
# un único provider "principal" y dejaba fuera a Python — "pip: command
# not found" en el build. `providers` fuerza a combinar ambos explícitamente
# en vez de dejar que nixpacks elija uno solo.
providers = ["python", "node"]

[phases.setup]
aptPkgs = ["tesseract-ocr", "tesseract-ocr-spa"]

[start]
cmd = "gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
