{# Lateral (nota 1): solo identifica y navega. Cada sección con su contador. #}
<div class="pf-me" aria-label="Tu perfil">
  <div class="pf-avatar" aria-hidden="true">{% if me.nombre %}{{ me.inicial }}{% else %}<i data-lucide="user-round"></i>{% endif %}</div>
  <div class="pf-min"><div class="pf-me-n">{{ me.nombre or 'Tu perfil' }}</div><div class="t-meta">Tú · Αὐτός</div></div>
</div>
<nav class="pf-subnav" aria-label="Secciones del perfil">
  {% for id, icon, label in sections %}
  {% set c = nav_counts.get(id, {}) %}
  <a class="pf-nav-it" href="?sec={{ id }}" data-sec-link="{{ id }}"{% if id == cur %} aria-current="page"{% endif %}>
    <i data-lucide="{{ icon }}"></i><span class="pf-grow">{{ label }}</span>
    <span class="num pf-nav-ct{{ ' is-warn' if c.warn }}" data-ct="{{ id }}">{{ c.txt }}</span>
  </a>
  {% endfor %}
</nav>
