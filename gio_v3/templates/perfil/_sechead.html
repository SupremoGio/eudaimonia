{# Encabezado de sección: eyebrow, título y una acción a la derecha (html). #}
<header class="pf-sec-hd">
  <div class="eu-grow">
    <div class="t-eyebrow pf-eyebrow">Tú · Αὐτός</div>
    <h1 class="t-page pf-sec-title">{{ sec_title }}</h1>
    {% if sec_sub %}<p class="t-meta pf-p">{{ sec_sub }}</p>{% endif %}
  </div>
  {% if sec_action %}{{ sec_action|safe }}{% endif %}
</header>
