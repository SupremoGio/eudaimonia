{# Encabezado de sección (h2): título y una acción a la derecha (html). El h1 «Perfil» va una vez arriba (ui.page_head). #}
<header class="pf-sec-hd">
  <div class="eu-grow">
    <h2 class="t-section pf-sec-title">{{ sec_title }}</h2>
    {% if sec_sub %}<p class="t-meta pf-p">{{ sec_sub }}</p>{% endif %}
  </div>
  {% if sec_action %}{{ sec_action|safe }}{% endif %}
</header>
