{# Gasto libre de EC (nota 8): plegado por defecto. Pesos ⇄ EC en una fila. #}
<details class="eu-card rw-spend">
  <summary class="rw-spend-sum"><i data-lucide="banknote"></i><span class="eu-grow">Registrar gasto libre</span><i data-lucide="chevron-down" class="rw-chev"></i></summary>
  <form class="rw-spend-bd js-spend" autocomplete="off">
    <div class="rw-spend-row">
      <input class="eu-input eu-input--money" id="g-pesos" type="number" min="0" inputmode="decimal" placeholder="$150" aria-label="Pesos MXN">
      <span class="t-meta">=</span>
      <input class="eu-input eu-input--money rw-spend-ec" id="g-ec" type="number" min="1" inputmode="numeric" placeholder="15 EC" aria-label="EC">
    </div>
    <input class="eu-input" id="g-desc" placeholder="¿En qué? Helado, cine…" maxlength="120" aria-label="¿En qué lo gastaste?">
    <button type="submit" class="eu-btn eu-btn--secondary">Registrar</button>
  </form>
</details>
