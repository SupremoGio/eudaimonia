{# Documentos, póliza de seguro y siniestros #}
<div class="hm-pane" id="pane-papeles" role="tabpanel" aria-labelledby="tab-papeles" hidden>
  <div class="hm-papers">
    <section class="eu-vstack hm-sec" aria-labelledby="hm-doc-t">
      <div class="eu-between"><h2 class="t-card" id="hm-doc-t">Documentos</h2><button type="button" class="eu-btn eu-btn--ghost eu-btn--sm js-doc-new"><i data-lucide="upload"></i>Subir</button></div>
      <div class="hm-cards" id="hm-doc-list"></div>
    </section>
    <section class="eu-vstack hm-sec" aria-labelledby="hm-pol-t">
      <div class="eu-between"><h2 class="t-card" id="hm-pol-t">Póliza de seguro</h2><button type="button" class="eu-btn eu-btn--ghost eu-btn--sm js-pol-new"><i data-lucide="plus"></i>Agregar</button></div>
      <div class="hm-cards" id="hm-poliza-list"></div>
    </section>
    <section class="eu-vstack hm-sec" aria-labelledby="hm-sin-t">
      <div class="eu-between"><h2 class="t-card" id="hm-sin-t">Siniestros</h2><button type="button" class="eu-btn eu-btn--ghost eu-btn--sm js-sin-new"><i data-lucide="plus"></i>Registrar</button></div>
      <div class="hm-cards" id="hm-siniestro-list"></div>
    </section>
  </div>
</div>
