{# Toast de XP con «Deshacer» (5 s). aria-live para lectores de pantalla. #}
<div class="acta-toast-wrap" aria-live="polite">
  <div class="eu-toast eu-toast--xp acta-toast js-toast" hidden>
    <i data-lucide="sparkles"></i>
    <span class="grow js-toast-msg"></span>
    <button type="button" class="eu-btn eu-btn--ghost eu-btn--sm js-undo">Deshacer</button>
    <span class="eu-toast-timer js-toast-timer"></span>
  </div>
</div>
