{# Runner de la sesión guiada. El cierre ya no es un modal: se hace en la
   tarjeta «Sesión de hoy» (Eurythmia v2, nota 5). #}
<div class="eu-scrim ey-run-scrim" id="m-run" hidden>
  <div class="eu-modal ey-runner" role="dialog" aria-modal="true" aria-labelledby="ey-r-name" data-cat="eurythmia">
    <div class="eu-modal-bd ey-runner-bd">
      <div class="t-eyebrow" id="ey-r-phase">Fase 1 / 3</div>
      <div class="t-page ey-r-name" id="ey-r-name">Disociación</div>
      <p class="t-body ey-r-desc" id="ey-r-desc"></p>
      <div class="t-data ey-r-time" id="ey-r-time" role="timer" aria-live="off">10:00</div>
      <div class="ey-r-dots" id="ey-r-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="eu-grid-2 ey-r-actions">
        <button type="button" class="eu-btn eu-btn--secondary" id="ey-r-pause"><i data-lucide="pause"></i><span>Pausar</span></button>
        <button type="button" class="eu-btn eu-btn--secondary" id="ey-r-skip">Siguiente fase<i data-lucide="skip-forward"></i></button>
      </div>
      <div class="ey-r-bpm"><span class="t-meta">Clave</span><input type="range" class="ey-range" id="ey-bpm-range" min="140" max="220" step="2" value="180" aria-label="Tempo de la clave en bpm"><span class="num t-meta"><span id="ey-bpm-n">180</span> bpm</span></div>
      <button type="button" class="eu-btn eu-btn--ghost eu-btn--block" id="ey-r-cancel">Cancelar sesión</button>
    </div>
  </div>
</div>
