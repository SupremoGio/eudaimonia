{# Captura (handoff Praxis v2, nota 1): una sola barra — campo, tipo y
   Capturar. Enter manda la tarea al Inbox; una Idea va directo al banco. #}
<form class="px-capture" id="px-capture" autocomplete="off">
  <div class="px-cap-row">
    <i data-lucide="plus" class="px-cap-ic"></i>
    <input class="px-cap-in" id="qi" placeholder="Captura rápida… Enter la manda al Inbox" aria-label="Captura rápida" maxlength="300">
    <div class="eu-seg px-cap-tipo" role="group" aria-label="Tipo">
      <button type="button" data-tipo="tarea" aria-pressed="true"><i data-lucide="pin"></i>Tarea</button>
      <button type="button" data-tipo="idea" aria-pressed="false"><i data-lucide="lightbulb"></i>Idea</button>
      <button type="button" data-tipo="mantenimiento" aria-pressed="false" aria-label="Mantenimiento" title="Mantenimiento"><i data-lucide="wrench"></i>Mant.</button>
    </div>
    <button type="submit" class="eu-btn eu-btn--primary px-cap-go">Capturar</button>
  </div>
</form>
