{# Pestaña Outfits: cifras, filtro por ocasión, grid y generador IA #}
<section class="gr-panel eu-vstack" data-panel="outfits" id="gr-outfits" aria-label="Outfits" hidden>
  <div class="eu-grid-3 gr-ostats">
    <div class="eu-card eu-stat"><div class="eu-stat-lbl"><i data-lucide="layers"></i>Outfits</div><div class="eu-stat-val" id="ot-total">0</div></div>
    <div class="eu-card eu-stat"><div class="eu-stat-lbl"><i data-lucide="calendar-check"></i>Usados · semana</div><div class="eu-stat-val" id="ot-week">0</div></div>
    <div class="eu-card eu-stat"><div class="eu-stat-lbl"><i data-lucide="star"></i>Ocasión favorita</div><div class="eu-stat-val gr-stat-txt" id="ot-fav">—</div></div>
  </div>
  <div class="eu-chips" id="ot-filters" role="group" aria-label="Filtrar por ocasión">
    {% for oc in ['', 'Formal', 'Business', 'Casual', 'Social', 'Deportivo', 'Cita'] %}
    <button type="button" class="eu-chip" data-occ="{{ oc }}" aria-pressed="{{ 'true' if not oc else 'false' }}">{{ oc or 'Todos' }}</button>
    {% endfor %}
  </div>
  <div class="gr-ogrid" id="ot-grid"></div>

  <button type="button" class="eu-card gr-coach-card js-coach" data-occ="">
    <span class="eu-row-ic fg-brand"><i data-lucide="sparkles"></i></span>
    <span class="eu-grow"><span class="t-card">Coach de imagen · IA</span><span class="t-meta">3 propuestas con tus prendas: por ocasión o a partir de una prenda</span></span>
    <i data-lucide="chevron-right"></i>
  </button>
</section>
