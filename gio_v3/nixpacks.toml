# El Root Directory del servicio en Railway está fijado a "gio_v3", así
# que ESTE es el nixpacks.toml que nixpacks realmente lee (no el de la
# raíz del repo) — nixpacks busca su config dentro del Root Directory
# configurado, no en la raíz del repositorio.
#
# Al agregar gio_v3/package.json (para compilar Tailwind localmente),
# nixpacks empezó a detectar Node junto con Python y elegía solo uno de
# los dos como provider "principal" — dejando pip fuera del setup phase
# ("pip: command not found" en el build). `providers` fuerza a combinar
# ambos explícitamente en vez de dejar que nixpacks elija uno solo.
providers = ["python", "node"]

[phases.setup]
aptPkgs = ["tesseract-ocr", "tesseract-ocr-spa"]
